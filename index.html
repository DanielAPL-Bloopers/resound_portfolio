<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>ReSound Masters Application</title>
	<link rel="stylesheet" href="styles.css">
    <link rel="icon" href="/DL_FAVICO.ico" type="image/x-icon">
</head>
<body>
	<div class="page-shell">
		<aside class="sidebar">
			<div class="brand-header">
				<img class="brand-logo" src="DL_FAVICO.ico" alt="">
				<div class="brand-copy">
					<h1>Daniel Lourenço</h1>
					<h2>ReSound Portfolio</h2>
				</div>
			</div>
			<nav aria-label="Portfolio sections">
				<ul class="menu">
					<li><a href="#portfolio">Portfolio</a></li>
					<li><a href="#cv">Curriculum</a></li>
					<li><a href="#motivation-letter">Motivation Letter</a></li>
					<li><a href="#thesis-proposal">Thesis Proposal</a></li>
				</ul>
			</nav>
		</aside>

		<main class="content">
			<section class="content-section" id="portfolio">
				<p class="section-number">01 / Portfolio</p>
				<h2>Selected Work</h2>
				<iframe title="SoundCloud player for Submersa by PostDramatik" width="100%" height="100" scrolling="no" frameborder="no" allow="autoplay; encrypted-media" src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/tracks/soundcloud%253Atracks%253A2325463727&color=%23ff5500&auto_play=false&hide_related=false&show_comments=true&show_user=true&show_reposts=false&show_teaser=true"></iframe>
				<details class="description">
					<summary>
						<span>Description</span>
						<span class="description-arrow" aria-hidden="true"></span>
					</summary>
					<div class="description-content">
						<p>Your description goes here.</p>
					</div>
				</details>
			</section>

			<section class="content-section" id="cv">
				<p class="section-number">02 / CV</p>
				<h2>Curriculum Vitae</h2>
			</section>

			<section class="content-section" id="motivation-letter">
				<p class="section-number">03 / Motivation Letter</p>
				<h2>Motivation Letter</h2>
			</section>

			<section class="content-section" id="thesis-proposal">
				<p class="section-number">04 / Thesis Proposal</p>
				<h2>Thesis Proposal</h2>
			</section>
		</main>
	</div>
</body>
</html>
